# Conf nginx du conteneur front (production).
#
# Copie de nginx.conf (préproduction) sans le proxy Swagger : la production
# n'expose que la SPA et l'API. Toute autre modification doit être reportée
# dans les deux fichiers (cf. docs/gitflow.md, une image par environnement).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API. `^~` garantit la priorité sur les locations regex ci-dessous — c'est
    # ce qui permet à /api/medias/{id}/file d'être proxifié plutôt que capté par
    # la location regex des extensions d'images, qui répondrait 404.
    location ^~ /api/ {
        # Le défaut nginx est de 1 Mo : sans cette ligne, tout dépôt d'affiche
        # est rejeté en 413 avant même d'atteindre le back. Doit rester cohérent
        # avec spring.servlet.multipart.max-request-size.
        client_max_body_size 20m;

        proxy_pass http://back:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin/** n'est volontairement PAS proxifié : ces routes d'exploitation
    # (état de l'ordonnanceur) restent joignables uniquement depuis le VPS via
    # le bind 127.0.0.1:8080 du conteneur back (tunnel SSH).

    # Les fichiers versionnés par hash (outputHashing: all) sont immuables.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache, sinon un déploiement peut
    # continuer à servir des références vers des bundles disparus.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Fallback SPA : le routage est géré côté Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
