# Conf nginx du conteneur front (preprod).
#
# Ce conteneur est le point d'entrée unique de l'application : il sert la SPA et
# proxifie l'API vers le conteneur `back`. Front et API partagent donc la même
# origine, ce qui supprime toute problématique CORS et permet à l'image d'être
# réutilisée telle quelle d'un environnement à l'autre.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API. `^~` garantit la priorité sur les locations regex ci-dessous.
    location ^~ /api/ {
        proxy_pass http://back:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger : conservé en préproduction, c'est un environnement de test.
    location ^~ /swagger-ui/ {
        proxy_pass http://back:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger-ui.html {
        proxy_pass http://back:8080/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://back:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin/** n'est volontairement PAS proxifié : FacebookAdminController
    # expose /admin/facebook/bootstrap et /admin/facebook/token/status sans
    # aucune authentification. Ces routes restent joignables uniquement depuis
    # le VPS via le bind 127.0.0.1:8080 du conteneur back (tunnel SSH).

    # Les fichiers versionnés par hash (outputHashing: all) sont immuables.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache, sinon un déploiement peut
    # continuer à servir des références vers des bundles disparus.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Fallback SPA : le routage est géré côté Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
