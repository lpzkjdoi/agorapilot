# En-têtes de sécurité, communs à la préproduction et à la production.
#
# Inclus dans le bloc `server` ET dans chaque `location` qui pose ses propres
# en-têtes : nginx n'hérite des `add_header` du niveau supérieur que si le
# niveau courant n'en déclare aucun.
#
# CSP : tout vient de la même origine (SPA et API derrière ce nginx).
#   - style-src 'unsafe-inline' : Angular injecte les styles des composants dans
#     des balises <style> ;
#   - img-src data: blob: : SVG en ligne et aperçus des fichiers choisis ;
#   - frame-ancestors 'none' : l'application ne s'affiche dans aucun cadre.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Un an, sans includeSubDomains : le domaine porte d'autres services que
# l'application.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
