<div class="bg-ui-card shadow-card rounded-lg p-4 w-full flex flex-col gap-2">
  <div class="flex justify-between">
    <h3>Publications à venir</h3>
    <button class="flex items-center gap-2">
      Voir tout
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000">
        <path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z" />
      </svg>
    </button>
  </div>
  @if (isEmpty()) {
    <p>Aucune publication prévue</p>
  } @else {
    <ul>
      @for (occurrence of upcomingOccurrences(); track occurrence.id) {
        <li>
          <app-upcoming-post-card [occurrence]="occurrence" />
        </li>
      }
    </ul>
  }
</div>
