<!-- Pas de fermeture au clic sur le fond ni à Échap : on ne perd pas ce mot de
     passe par mégarde. -->
<div class="modal-backdrop" aria-hidden="true"></div>

<div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="temporary-title">
  <header>
    <h2 id="temporary-title">Mot de passe provisoire de {{ username() }}</h2>
    <p class="modal-subtitle">
      Transmettez-le à la personne par un canal sûr. Il ne sera plus affiché : notez-le avant de fermer.
      Elle devra le changer à sa première connexion.
    </p>
  </header>

  <div class="temporary">
    <code class="temporary-value">{{ password() }}</code>
    <button type="button" class="temporary-copy" (click)="copy()">{{ copied() ? 'Copié' : 'Copier' }}</button>
  </div>

  <div class="modal-actions">
    <button type="button" class="primary" (click)="closed.emit()">J’ai noté le mot de passe</button>
  </div>
</div>
