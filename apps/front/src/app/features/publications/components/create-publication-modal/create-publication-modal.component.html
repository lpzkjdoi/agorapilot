<!-- Le fond est un vrai bouton : fermer au clic extérieur reste alors
     accessible au clavier, sans gestionnaire de clic sur un élément inerte. -->
<button type="button"
        class="modal-backdrop"
        aria-label="Fermer la fenêtre"
        (click)="closed.emit()"
></button>

<div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="create-publication-title">
  <header class="modal-header">
    <div>
      <h2 id="create-publication-title">Créer une publication</h2>
      <p class="modal-subtitle">Rédigez le contenu, il sera programmable ensuite.</p>
    </div>
    <button type="button" class="modal-close" aria-label="Fermer" (click)="closed.emit()">
      <svg xmlns="http://www.w3.org/2000/svg"
           height="20px"
           viewBox="0 -960 960 960"
           width="20px"
           fill="currentColor"
           aria-hidden="true"
      >
        <path
          d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
      </svg>
    </button>
  </header>

  <app-publication-form
    (submitted)="submitted.emit($event)"
    (cancelled)="closed.emit()"
  />
</div>
