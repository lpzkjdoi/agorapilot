<!-- Le fond est un vrai bouton : fermer au clic extérieur reste alors
     accessible au clavier, sans gestionnaire de clic sur un élément inerte. -->
<button type="button"
        class="modal-backdrop"
        aria-label="Fermer la fenêtre"
        (click)="closed.emit()"
></button>

<div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="assign-campaign-title">
  <header class="modal-header">
    <h2 id="assign-campaign-title">Assigner à une campagne</h2>
    <button type="button" class="modal-close" aria-label="Fermer" (click)="closed.emit()">
      <svg xmlns="http://www.w3.org/2000/svg"
           height="20px"
           viewBox="0 -960 960 960"
           width="20px"
           fill="currentColor"
           aria-hidden="true"
      >
        <path
          d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
      </svg>
    </button>
  </header>

  <div class="assign-field">
    <p class="assign-label">Publication</p>
    <p class="assign-publication">{{ publication().content }}</p>
  </div>

  <div class="assign-field">
    <label for="assign-campaign">Campagne</label>
    <!-- La sélection est portée par les options : un `[value]` sur le `select`
         s'appliquerait avant que le `@for` ne les ait rendues. -->
    <select id="assign-campaign" (change)="onSelect($event)">
      <option [value]="none" [selected]="selected() === none">Aucune campagne</option>
      @for (campaign of campaigns(); track campaign.id) {
        <option [value]="campaign.id" [selected]="selected() === campaign.id.toString()">
          {{ campaign.name }}
        </option>
      }
    </select>
  </div>

  <div class="modal-actions">
    <button type="button" class="secondary" [disabled]="saving()" (click)="closed.emit()">
      Annuler
    </button>
    <button type="button" class="primary" [disabled]="saving() || unchanged()" (click)="onSubmit()">
      @if (saving()) {
        <!-- Fond bleu nuit : c'est la variante `dark` du loader. -->
        <app-loader size="sm" variant="dark" label="Enregistrement en cours…" />
      }
      Assigner
    </button>
  </div>
</div>
