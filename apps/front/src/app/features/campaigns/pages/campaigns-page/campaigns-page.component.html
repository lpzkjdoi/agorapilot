<div class="campaigns-page">
  <header class="campaigns-header">
    <h1>Campagnes</h1>
    <p class="campaigns-subtitle">Gérez vos campagnes de communication</p>
  </header>

  @if (error(); as message) {
    <p class="campaigns-error" role="alert">{{ message }}</p>
  } @else if (loading()) {
    <div class="campaigns-loading">
      <app-loader size="lg" label="Chargement des campagnes…" />
    </div>
  } @else {
    <app-campaign-list
      [campaigns]="campaigns()"
      [selectedId]="selectedId()"
      [canCreate]="canWrite()"
      (selected)="selectedId.set($event.id)"
      (createRequested)="modal.set('create')"
    />

    @if (selected(); as campaign) {
      <app-campaign-detail
        [campaign]="campaign"
        [canWrite]="canWrite()"
        [busy]="acting() || detaching()"
        [occurrences]="planning().occurrences"
        [planningUnavailable]="planning().failed"
        [canSchedule]="canSchedule()"
        [canAssign]="canAssign()"
        (edit)="modal.set('edit')"
        (actionConfirmed)="onAction($event)"
        (schedule)="schedulingFor.set($event)"
        (addPublications)="onAddRequested()"
        (detach)="onDetach($event)"
      />
    }
  }
</div>

@if (modal(); as mode) {
  <app-campaign-form-modal
    [campaign]="mode === 'edit' ? selected() : null"
    [saving]="saving()"
    (closed)="modal.set(null)"
    (submitted)="onSubmit($event)"
  />
}

@if (addModalOpen() && selected(); as campaign) {
  <app-add-publications-modal
    [campaign]="campaign"
    [publications]="candidates()"
    [saving]="adding()"
    (closed)="addModalOpen.set(false)"
    (submitted)="onAddSubmitted($event)"
  />
}

@if (schedulingFor(); as publication) {
  <app-schedule-occurrence-modal
    [publication]="publication"
    [saving]="scheduling()"
    (closed)="schedulingFor.set(null)"
    (submitted)="onScheduleSubmitted($event)"
  />
}
