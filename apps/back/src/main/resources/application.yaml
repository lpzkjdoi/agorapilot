spring:
  application:
    name: agorapilot-back
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/agorapilot-db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  devtools:
    restart:
      enabled: true

  servlet:
    multipart:
      # Le défaut Spring est de 1 Mo : une affiche le dépasse presque toujours.
      # Doit rester cohérent avec le client_max_body_size du nginx du front.
      max-file-size: 15MB
      max-request-size: 20MB

  # Le schéma est porté par Flyway (src/main/resources/db/migration) ; Hibernate
  # se contente de vérifier au démarrage qu'il correspond aux entités, et refuse
  # de démarrer sinon. Toute évolution du schéma passe par une nouvelle
  # migration `V<n>__<sujet>.sql`, jamais par une modification d'une migration
  # déjà jouée.
  flyway:
    # Une base créée avant Flyway (préproduction) a déjà toutes ses tables mais
    # pas d'historique : elle est inscrite d'office en version 1 et ne rejoue
    # pas le schéma de départ. Sans effet sur une base vide, qui joue V1.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Schéma créé par Hibernate avant Flyway

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

server:
  port: ${PORT:8080}
  servlet:
    session:
      # Inactivité au-delà de laquelle la session expire ; la durée de vie
      # maximale, activité ou non, est `agorapilot.security.session-max-age`.
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        # `true` en préproduction (HTTPS) ; le développement local passe par
        # http://localhost.
        secure: ${SESSION_COOKIE_SECURE:false}

facebook:
  api-base-url: ${FACEBOOK_API_BASE_URL:https://graph.facebook.com}
  api-version: ${FACEBOOK_API_VERSION:v25.0}
  client-secret: ${FACEBOOK_CLIENT_SECRET:}
  client-id: ${FACEBOOK_CLIENT_ID:}
  page-id: ${FACEBOOK_PAGE_ID:}
  # Pas de access-token : le token de page vit en base, posé soit par la
  # connexion depuis l'interface (table facebook_connections), soit par le
  # bootstrap historique POST /admin/facebook/bootstrap (table facebook_tokens).
  connection:
    # `connection` : le jeton connecté depuis la page « Canal Facebook » publie ;
    # faute de connexion, le jeton historique sert encore. `legacy` : retour
    # arrière, seul le mécanisme historique publie, connexion et contrôle coupés.
    token-source: ${FACEBOOK_TOKEN_SOURCE:connection}
    # Contrôle quotidien du jeton connecté, avant la fenêtre de publication.
    check-cron: ${FACEBOOK_CONNECTION_CHECK_CRON:0 0 7 * * *}

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

agorapilot:
  security:
    # Premier compte, créé au démarrage si la base n'en a aucun. Mot de passe
    # provisoire : il faut le changer à la première connexion.
    initial-admin:
      username: ${AGORAPILOT_ADMIN_USERNAME:}
      password: ${AGORAPILOT_ADMIN_PASSWORD:}
    max-failed-attempts: 5
    lock-duration: PT15M
    session-max-age: PT12H

  scheduling:
    # Période de balayage des occurrences dues (durée ISO-8601). La granularité
    # de la planification ne dépasse pas cette valeur : une occurrence prévue à
    # 10h00 part entre 10h00 et 10h01.
    occurrences-delay: ${OCCURRENCES_SCHEDULER_DELAY:PT1M}
    # Retard maximal toléré (durée ISO-8601). Au-delà — typiquement au
    # redémarrage après une panne — la livraison passe en échec au lieu d'être
    # diffusée : une annonce d'événement déjà passé ne doit pas partir.
    max-lateness: ${OCCURRENCES_MAX_LATENESS:PT1H}
    # Fenêtre de publication Facebook (heures locales, TZ du conteneur). Une
    # diffusion programmée « pour un jour », sans heure, est placée dans cette
    # fenêtre, répartie uniformément avec les autres diffusions du même jour.
    window-start: ${PUBLICATION_WINDOW_START:15:00}
    window-end: ${PUBLICATION_WINDOW_END:22:00}

  media:
    # Volume disque monté sur le conteneur back en préproduction ; répertoire
    # local ignoré par git en développement.
    root: ${MEDIA_ROOT:./data/media}
    # Liste blanche. Le SVG en est délibérément absent : servi en `inline`, il
    # exécuterait son JavaScript dans l'origine de l'application.
    allowed-content-types: image/jpeg,image/png,image/webp,application/pdf
