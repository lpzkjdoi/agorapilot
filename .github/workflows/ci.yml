name: Back CI

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/back/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/back/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  checks: write

jobs:
  back-build-test:
    name: Back CI / build & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # `verify` exécute la compilation, les tests puis le packaging du jar.
      # On produit ainsi un artefact réellement déployable, pas seulement des tests verts.
      - name: Build & test
        run: mvn -B verify

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: back-jar
          path: apps/back/target/*.jar
          if-no-files-found: warn
          retention-days: 7
