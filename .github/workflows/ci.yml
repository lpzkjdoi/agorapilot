name: Back CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/back/**'
      - '.github/workflows/ci.yml'
  # Sur les pull requests, ce workflow n'est plus déclenché directement : il est
  # appelé par « PR checks » (.github/workflows/pr-checks.yml), qui décide s'il
  # y a lieu de vérifier le back et agrège les résultats dans un statut unique.
  workflow_call:

# `checks: write` a été retiré : aucune étape ne publie de check-run, et un
# workflow appelé ne peut pas demander plus de droits que son appelant.
permissions:
  contents: read

jobs:
  back-build-test:
    name: Back CI / build & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # `verify` exécute la compilation, les tests puis le packaging du jar.
      # On produit ainsi un artefact réellement déployable, pas seulement des tests verts.
      - name: Build & test
        run: mvn -B verify

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: back-jar
          path: apps/back/target/*.jar
          if-no-files-found: warn
          retention-days: 7
